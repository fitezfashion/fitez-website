<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Let's find my perfect fit</title>
  <script>
      function showFieldsBasedOnGender() {
          var gender = document.getElementById("gender").value;
          var femaleFields = document.querySelectorAll(".female-field");
          var maleFields = document.querySelectorAll(".male-field");
          var additionalFemaleFields = document.querySelectorAll(".additional-female-field");
          var additionalMaleFields = document.querySelectorAll(".additional-male-field");

          femaleFields.forEach(function(field) {
              field.style.display = (gender === 'Female') ? 'block' : 'none';
          });

          maleFields.forEach(function(field) {
              field.style.display = (gender === 'Male') ? 'block' : 'none';
          });

          // Hide additional fields initially
          additionalFemaleFields.forEach(function(field) {
              field.style.display = 'none';
          });

          additionalMaleFields.forEach(function(field) {
              field.style.display = 'none';
          });

          showAdditionalFields(); // Reevaluate the additional fields based on current selection
      }

      function showAdditionalFields() {
          var inputContinue = document.getElementById("input_continue").value;
          var gender = document.getElementById("gender").value;
          var additionalFemaleFields = document.querySelectorAll(".additional-female-field");
          var additionalMaleFields = document.querySelectorAll(".additional-male-field");

          if (gender === 'Female') {
              additionalFemaleFields.forEach(function(field) {
                  field.style.display = (inputContinue === 'Yes') ? 'block' : 'none';
              });
          } else if (gender === 'Male') {
              additionalMaleFields.forEach(function(field) {
                  field.style.display = (inputContinue === 'Yes') ? 'block' : 'none';
              });
          }
      }

      document.addEventListener("DOMContentLoaded", function() {
          showFieldsBasedOnGender();
      });
  </script>
  <style>
      .female-field, .male-field, .additional-female-field, .additional-male-field {
          display: none;
      }
      .required:after {
          content: "*";
          color: red;
          margin-left: 5px;
      }
      body {
            margin: 20;
            background-color: #F5F2EB ;
        }
  </style>

</head>
<body>
  <h3>Let's find my perfect fit</h3>
  <form id="sizePredictorForm">
      <label for="gender">I am</label>
      <select id="gender" name="gender" onchange="showFieldsBasedOnGender()" required>
          <option value="" selected></option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
      </select><br><br>

      <label for="height">My height <i>(cm)</i></label>
      <input type="text" id="height" name="height" value="" required><br><br>

      <label for="weight">My weight <i>(kg)</i></label>
      <input type="text" id="weight" name="weight" value="" required><br><br>

      <label for="age">My age</label>
      <input type="text" id="age" name="age" value="" required><br><br>

      <label for="fit_preference">My fit style</label>
      <select id="fit_preference" name="fit_preference" value="" required>
        <option value="Regular" selected>Regular</option>
        <option value="Tight">Tight</option>
        <option value="Loose">Loose</option>
      </select><br><br>

      <div class="female-field">
          <label for="bust_size">Bust <i>(inches)</i></label>
          <input type="text" id="bust_size" name="bust_size" value="" required><br><br>
      </div>

      <div class="male-field">
          <label for="waist_size">Waist <i>(inches)</i></label>
          <input type="text" id="waist_size" name="waist_size" value="" required><br><br>
      </div>

      <label for="input_continue">Get more precise?</label>
      <select id="input_continue" name="input_continue" onchange="showAdditionalFields()" required>
          <option value="No" selected>No</option>
          <option value="Yes">Yes</option>
      </select><br><br>

      <div class="additional-female-field female-field">
          <label for="waist_size">Waist <i>(inches)</i></label>
          <input type="text" id="waist_size" name="waist_size" value=""><br><br>

          <label for="hip_circumference">Hips <i>(inches)</i></label>
          <input type="text" id="hip_circumference" name="hip_circumference" value=""><br><br>

          <label for="inseam_length">Inseam <i>(cm)</i></label>
          <input type="text" id="inseam_length" name="inseam_length" value=""><br><br>

          <label for="brand_used">A brand that fits me well</label>
          <select id="brand_used" name="brand_used" value="">
            <option value="" selected></option>
            <option value="Banana Republic">Banana Republic</option>
            <option value="Forever 21">Forever 21</option>
            <option value="Gap">Gap</option>
            <option value="Nike">Nike</option>
            <option value="Old Navy">Old Navy</option>
            <option value="Zara">Zara</option>
          </select><br><br>

          <label for="brand_size_used">My size in that brand</label>
          <select id="brand_size_used" name="brand_size_used" value="">
            <option value="" selected></option>
            <option value="3XS">3XS</option>
            <option value="2XS">2XS</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="2XL">2XL</option>
            <option value="3XL">3XL</option>
            <option value="4XL">4XL</option>
            <option value="5XL">5XL</option>
          </select><br><br>
      </div>

      <div class="additional-male-field male-field">
          <label for="chest_circumference">Chest  <i>(inches)</i></label>
          <input type="text" id="chest_circumference" name="chest_circumference" value=""><br><br>

          <label for="hip_circumference">Hips  <i>(inches)</i></label>
          <input type="text" id="hip_circumference" name="hip_circumference" value=""><br><br>

          <label for="inseam_length">Inseam  <i>(cm)</i></label>
          <input type="text" id="inseam_length" name="inseam_length" value=""><br><br>

          <label for="brand_used">A brand that fits me well</label>
          <select id="brand_used" name="brand_used" value="">
            <option value="" selected></option>
            <option value="Banana Republic">Banana Republic</option>
            <option value="Forever 21">Forever 21</option>
            <option value="Gap">Gap</option>
            <option value="Nike">Nike</option>
            <option value="Old Navy">Old Navy</option>
            <option value="Zara">Zara</option>
          </select><br><br>

          <label for="brand_size_used">My size in that brand</label>
          <select id="brand_size_used" name="brand_size_used" value="">
            <option value="" selected></option>
            <option value="3XS">3XS</option>
            <option value="2XS">2XS</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="2XL">2XL</option>
            <option value="3XL">3XL</option>
            <option value="4XL">4XL</option>
            <option value="5XL">5XL</option>
          </select><br><br>
      </div>
      <button type="button" onclick="submitForm()">Get My Fit</button>
  </form>

    <h2 id="predictedSize" style="display: none;">My Fit: </h2>
    <p id="timeTaken" style="display: none; font-size: 16px; font-weight: bold; color: #1a6b2f; border: 1px solid #1a6b2f; border-radius: 4px; padding: 8px 12px; display: none; width: fit-content; margin-top: 4px;">⏱ Response time: </p>
    <h2 id="error" style="color: red;"></h2>

    <script>
        // Disable right-click
        //document.addEventListener('contextmenu', event => event.preventDefault());
        // Disable specific keyboard shortcuts
        //document.addEventListener('keydown', function(event) {
        //    if (event.key === 'F12' || 
        //        (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'J' || event.key === 'C')) || 
        //        (event.ctrlKey && event.key === 'U')) {
        //            event.preventDefault();
        //        }
        //});
        // Disable certain mouse clicks
        //document.addEventListener('mousedown', function(event) {
        //    if (event.button === 2 || event.button === 1) {
        //        event.preventDefault();
        //    }
        //});

        function submitForm() {
            // --- START TIMER: recorded the instant button is clicked ---
            var startTime = performance.now();
 
            // Hide previous results and timer before new submission
            document.getElementById('predictedSize').style.display = 'none';
            document.getElementById('timeTaken').style.display = 'none';
            document.getElementById('error').style.display = 'none'; 
          
            const gender = document.getElementById('gender').value;
            const formData = {
                gender: gender,
                height: parseFloat(document.getElementById('height').value),
                weight: parseFloat(document.getElementById('weight').value),
                age: parseInt(document.getElementById('age').value),
                fit_preference: document.getElementById('fit_preference').value,
                api_key: 'CustomerID_0000001'  // Replace with actual API Key - correct is CustomerID_0000001
                //secret: 'YOUR_SECRET'     // Replace with actual Secret
            };

            if (gender === 'Male') {
                formData.waist_size = parseFloat(document.getElementById('waist_size').value);

                const chestCircumference = document.getElementById('chest_circumference');
                if (chestCircumference && chestCircumference.value) {
                    formData.chest_circumference = parseFloat(chestCircumference.value);
                }
            } else if (gender === 'Female') {
                formData.bust_size = parseFloat(document.getElementById('bust_size').value);
                
                const waistSize = document.querySelector('.additional-female-field #waist_size');
                if (waistSize && waistSize.value) {
                    formData.waist_size = parseFloat(waistSize.value);
                }
            }

            const hipCircumference = document.getElementById('hip_circumference');
            if (hipCircumference && hipCircumference.value) {
                formData.hip_circumference = parseFloat(hipCircumference.value);
            }

            const inseamLength = document.getElementById('inseam_length');
            if (inseamLength && inseamLength.value) {
                formData.inseam_length = parseFloat(inseamLength.value);
            }

            const brandUsed = document.getElementById('brand_used');
            if (brandUsed && brandUsed.value) {
                formData.brand_used = brandUsed.value;
            }

            const brandSizeUsed = document.getElementById('brand_size_used');
            if (brandSizeUsed && brandSizeUsed.value) {
                formData.brand_size_used = brandSizeUsed.value;
            }

            console.log('Form data being sent:', formData);

          fetch('https://api.fitezapp.com/api/predict_size', {  
          //fetch('http://3.135.111.197:5000/api/predict_size', { // (1) 'http://3.135.111.197:5000/api/predict_size'; (2) https://api.fitezapp.com:5000/api/predict_size; 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.predicted_size) {
                    // --- STOP TIMER: recorded the instant response is ready to display ---
                    var endTime = performance.now();
                    var timeTakenSeconds = ((endTime - startTime) / 1000).toFixed(2);
                    
                    document.getElementById('predictedSize').innerHTML = `My  Fit: ${data.predicted_size}`;
                    document.getElementById('predictedSize').style.display = 'block';

                    // Display the elapsed time below the result
                    document.getElementById('timeTaken').innerHTML = `Response time: ${timeTakenSeconds} seconds`;
                    document.getElementById('timeTaken').style.display = 'block';
 
                    document.getElementById('error').style.display = 'none';
                }
                else {
                    throw new Error('No predicted size in response');
                }
            })
            .catch(error => {
                document.getElementById('error').innerText = 'An error occurred. Please try again.';
                document.getElementById('error').style.display = 'block';
                document.getElementById('predictedSize').style.display = 'none';
                console.error('Error:', error);
            });
        }
    </script>

</body>
</html>
